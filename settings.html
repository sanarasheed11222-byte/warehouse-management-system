<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Warehouse Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="d-flex">
    <!-- SIDEBAR -->
    <nav class="sidebar bg-dark text-white p-3" id="sidebar">
      <h4 class="mb-4"><i class="bi bi-box-seam"></i> Warehouse</h4>
      <ul class="nav flex-column gap-1">
        <li class="nav-item"><a href="dashboard.html" class="nav-link text-white"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li class="nav-item"><a href="products.html" class="nav-link text-white"><i class="bi bi-box me-2"></i>Products</a></li>
        <li class="nav-item"><a href="categories.html" class="nav-link text-white"><i class="bi bi-tags me-2"></i>Categories</a></li>
        <li class="nav-item"><a href="suppliers.html" class="nav-link text-white"><i class="bi bi-truck me-2"></i>Suppliers</a></li>
        <li class="nav-item"><a href="stock-in.html" class="nav-link text-white"><i class="bi bi-box-arrow-in-down me-2"></i>Stock In</a></li>
        <li class="nav-item"><a href="stock-out.html" class="nav-link text-white"><i class="bi bi-box-arrow-up me-2"></i>Stock Out</a></li>
        <li class="nav-item"><a href="orders.html" class="nav-link text-white"><i class="bi bi-cart-check me-2"></i>Orders</a></li>
        <li class="nav-item"><a href="reports.html" class="nav-link text-white"><i class="bi bi-graph-up me-2"></i>Reports</a></li>
        <li class="nav-item"><a href="profile.html" class="nav-link text-white"><i class="bi bi-person-circle me-2"></i>Profile</a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link text-white active"><i class="bi bi-gear me-2"></i>Settings</a></li>
      </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">
      <nav class="navbar navbar-light bg-white shadow-sm px-3">
        <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <nav aria-label="breadcrumb" class="ms-2">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-item active">Settings</li>
          </ol>
        </nav>
        <span class="navbar-text ms-auto d-flex align-items-center gap-3">
          <i class="bi bi-bell fs-5"></i>
          <img src="https://via.placeholder.com/32" class="rounded-circle" alt="user">
          Admin
        </span>
      </nav>

      <main class="p-4">
        <h2 class="mb-4">Settings</h2>

        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body p-4">
            <h6 class="mb-3">General Settings</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Store Name</label>
                <input type="text" class="form-control" value="Amazon Warehouse Store">
              </div>
              <div class="col-md-6">
                <label class="form-label">Currency</label>
                <select class="form-select">
                  <option selected>PKR (Rs)</option>
                  <option>USD ($)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Timezone</label>
                <select class="form-select">
                  <option selected>Asia/Karachi (PKT)</option>
                  <option>UTC</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Low Stock Alert Threshold</label>
                <input type="number" class="form-control" value="10">
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body p-4">
            <h6 class="mb-3">Notification Preferences</h6>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" checked>
              <label class="form-check-label">Email notifications for low stock</label>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" checked>
              <label class="form-check-label">Email notifications for new orders</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox">
              <label class="form-check-label">SMS alerts</label>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h6 class="mb-3">Appearance</h6>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="theme" checked>
              <label class="form-check-label">Light Mode</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="theme">
              <label class="form-check-label">Dark Mode</label>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Settings</button>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
